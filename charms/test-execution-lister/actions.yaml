calculate-tests:
  description: Calculate spread tests to execute from changed files and backend:system list.
  params:
    changed-files:
      type: string
      description: "Comma or newline separated changed file paths."
    backend-systems:
      type: string
      description: "Comma or newline separated backend:system values."
  required:
    - backend-systems

add-tests:
  description: Append new spread tests to added-spread-tests.txt.
  params:
    tests:
      type: string
      description: "Comma or newline separated test paths to append."
  required:
    - tests

mongodb-updated:
  description: Regenerate spread-tests-execution.json from mongodb and clear added-spread-tests.txt.

reconcile:
  description: Rebuild charm state, secret file, and API service.

service-status:
  description: Return current systemd status for the API service.
