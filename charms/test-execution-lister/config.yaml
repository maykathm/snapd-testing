options:
  listen-host:
    type: string
    default: 127.0.0.1
    description: "Host for the local API service."
  listen-port:
    type: int
    default: 8181
    description: "Port for the local API service."
  mongodb-secret-id:
    type: string
    default: ""
    description: "Juju secret ID containing mongodb credentials json."
  query-features-path:
    type: string
    default: /home/ubuntu/source/snapd/tests/utils/features/query_features.py
    description: "Absolute path to query_features.py on the unit."
  query-features-requirements-path:
    type: string
    default: ""
    description: "Optional path to the requirements.txt used by query_features.py; defaults to the sibling requirements.txt next to query_features-path."
  execution-data-dir:
    type: string
    default: /var/lib/test-execution-lister
    description: "Directory that contains spread-execution-map.json and base-executions.json."
  added-spread-tests-path:
    type: string
    default: /var/lib/test-execution-lister/added-spread-tests.txt
    description: "Path to added-spread-tests.txt consumed by the service."
  refresh-helper-command:
    type: string
    default: ""
    description: "Optional command used to regenerate spread-execution-map.json and base-executions.json. If unset, built-in helper is used."
  base-tests-max-minutes:
    type: int
    default: 0
    description: "Maximum amount of execution time, in minutes, for the base test coverage set."
  refresh-timeout-seconds:
    type: int
    default: 300
    description: "Timeout for mongodb refresh helper command."
